<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0f14"/>
      <stop offset="0.6" stop-color="#1d2433"/>
      <stop offset="1" stop-color="#3a4a1a"/>
    </linearGradient>
    <linearGradient id="volt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1ffc8"/><stop offset="1" stop-color="#a9d42c"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>
  <rect width="1600" height="400" fill="url(#bg)"/>
  <circle cx="1380" cy="200" r="220" fill="#c8f04f" opacity=".22" filter="url(#glow)"/>
  <g opacity=".07" stroke="#fff"><path d="M0 80 H1600 M0 160 H1600 M0 240 H1600 M0 320 H1600"/></g>

  <text x="80" y="150" font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900" font-style="italic" font-size="62" fill="#fff">SI LA ENTREGA FALLA,</text>
  <text x="80" y="240" font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900" font-style="italic" font-size="70">
    <tspan fill="url(#volt)">TE DEVOLVEMOS</tspan><tspan fill="#fff"> TU DINERO</tspan>
  </text>
  <text x="84" y="310" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="27" fill="#c9d3e3">✔ Pago verificado     ✔ Sin contraseñas     ✔ Soporte real</text>

  <g filter="url(#shadow)" transform="translate(1390 200) scale(0.74) translate(-930 -315)">
    <circle cx="930" cy="315" r="190" fill="#151a24" stroke="url(#volt)" stroke-width="12"/>
    <path d="M830 330 a100 100 0 1 0 30 -90" fill="none" stroke="url(#volt)" stroke-width="30" stroke-linecap="round"/>
    <path d="M818 200 L870 238 L820 282 Z" fill="#c8f04f"/>
    <text x="935" y="352" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="104" fill="#f1ffc8">$</text>
  </g>
</svg>
