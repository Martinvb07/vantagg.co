<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0624"/>
      <stop offset="0.6" stop-color="#2a1475"/>
      <stop offset="1" stop-color="#6d3df5"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c8f04f"/><stop offset="1" stop-color="#45d99b"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="120" r="230" fill="#8b5cff" opacity=".45" filter="url(#glow)"/>
  <!-- radar -->
  <g opacity=".25" fill="none" stroke="#c4b5ff" stroke-width="2">
    <circle cx="1040" cy="520" r="120"/><circle cx="1040" cy="520" r="200"/><circle cx="1040" cy="520" r="280"/>
  </g>

  <text x="600" y="140" text-anchor="middle" font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900" font-style="italic" font-size="96" fill="#fff">SIGUE TU PEDIDO</text>
  <text x="600" y="215" text-anchor="middle" font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900" font-style="italic" font-size="64" fill="#c8f04f">EN VIVO</text>

  <g filter="url(#shadow)">
    <rect x="150" y="270" rx="28" width="900" height="250" fill="#ffffff"/>
    <text x="200" y="330" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="22" fill="#6b6b80">PEDIDO</text>
    <text x="200" y="372" font-family="Courier New, monospace" font-weight="700" font-size="40" letter-spacing="4" fill="#120a2e">VX-7K2M-9QHT</text>
    <rect x="820" y="318" rx="22" width="190" height="44" fill="#e9fbe0"/>
    <circle cx="848" cy="340" r="8" fill="#22a85a"/>
    <text x="930" y="349" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="20" fill="#15803d">ENTREGADO</text>
    <rect x="200" y="410" rx="7" width="190" height="14" fill="url(#bar)"/>
    <rect x="404" y="410" rx="7" width="190" height="14" fill="url(#bar)"/>
    <rect x="608" y="410" rx="7" width="190" height="14" fill="url(#bar)"/>
    <rect x="812" y="410" rx="7" width="190" height="14" fill="url(#bar)"/>
    <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" fill="#3b3b52">
      <text x="200" y="465">Creado</text><text x="404" y="465">Pagado</text><text x="608" y="465">Entregando</text><text x="812" y="465">Entregado</text>
    </g>
  </g>
  <text x="600" y="580" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="28" fill="#ddd6ff">Con tu número de pedido · sin crear cuenta</text>
</svg>
