<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0f14"/>
      <stop offset="0.6" stop-color="#1d2433"/>
      <stop offset="1" stop-color="#3a4a1a"/>
    </linearGradient>
    <linearGradient id="volt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1ffc8"/><stop offset="1" stop-color="#a9d42c"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="800" height="520" fill="url(#bg)"/>
  <circle cx="680" cy="120" r="190" fill="#c8f04f" opacity=".2" filter="url(#glow)"/>

  <g filter="url(#shadow)">
    <circle cx="664" cy="120" r="78" fill="#151a24" stroke="url(#volt)" stroke-width="9"/>
    <path d="M612 92 a62 62 0 1 1 -6 46" fill="none" stroke="#c8f04f" stroke-width="9" stroke-linecap="round"/>
    <path d="M598 70 l12 26 l26 -10" fill="none" stroke="#c8f04f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="668" y="150" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="80" fill="#f1ffc8">$</text>
  </g>

  <text x="40" y="250" font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900" font-style="italic" font-size="50" fill="#fff">SI LA ENTREGA FALLA,</text>
  <text x="40" y="330" font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900" font-style="italic" font-size="66" fill="url(#volt)">TE DEVOLVEMOS</text>
  <text x="40" y="404" font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900" font-style="italic" font-size="66" fill="#fff">TU DINERO</text>
  <text x="44" y="466" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="25" fill="#c9d3e3">✔ Pago verificado   ✔ Sin contraseñas   ✔ Soporte real</text>
</svg>
