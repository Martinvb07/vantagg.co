    <g fill="#fff"><rect x="276" y="340" width="8" height="28" rx="2"/><rect x="293" y="340" width="8" height="28" rx="2"/><rect x="310" y="340" width="8" height="28" rx="2"/><rect x="327" y="340" width="8" height="28" rx="2"/><rect x="270" y="372" width="72" height="7" rx="2"/></g>
    <text x="308" y="438" font-size="44" fill="#fff">PSE</text>

    <rect x="408" y="300" rx="22" width="168" height="168" fill="#ffffff"/>
    <rect x="442" y="326" rx="10" width="100" height="66" fill="#1d2433"/>
