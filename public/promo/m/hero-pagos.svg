    <text x="676" y="440" font-size="30" fill="#0b2e74">CRÉDITO</text>
  </g>
  <text x="44" y="530" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="26" fill="#ffffff" fill-opacity=".85">Y Botón Bancolombia · no guardamos tu tarjeta</text>
