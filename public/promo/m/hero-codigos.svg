<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1200"/>
      <stop offset="0.55" stop-color="#5e3a00"/>
      <stop offset="1" stop-color="#f29a00"/>
    </linearGradient>
    <linearGradient id="ticket" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#ffb100"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="610" cy="130" r="180" fill="#ffcc33" opacity=".3" filter="url(#glow)"/>
  <g opacity=".1" stroke="#fff" stroke-width="2"><path d="M-40 560 L520 -40"/><path d="M240 640 L860 0"/></g>

  <g transform="rotate(-9 610 130)" filter="url(#shadow)">
    <rect x="450" y="62" rx="20" width="320" height="140" fill="url(#ticket)"/>
    <circle cx="450" cy="132" r="18" fill="#6e4300"/>
    <circle cx="770" cy="132" r="18" fill="#c97c00"/>
    <path d="M548 76 V188" stroke="#5e3a00" stroke-width="4" stroke-dasharray="8 9" stroke-linecap="round"/>
    <text x="499" y="152" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="54" fill="#5e3a00">%</text>
    <text x="660" y="136" text-anchor="middle" font-family="Courier New, monospace" font-weight="700" font-size="38" letter-spacing="3" fill="#3a2400">CÓDIGO</text>
    <text x="660" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#5e3a00">APLÍCALO AL PAGAR</text>
  </g>
  <g fill="#fff"><circle cx="420" cy="60" r="4"/><circle cx="760" cy="300" r="3"/></g>

  <text x="40" y="282" font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900" font-style="italic" font-size="70" fill="#fff">¿TIENES UN</text>
  <text x="34" y="392" font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900" font-style="italic" font-size="118" fill="url(#ticket)" stroke="#2a1800" stroke-width="5" paint-order="stroke">CÓDIGO?</text>
  <text x="44" y="440" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="28" fill="#ffe9c2">Escríbelo en el último paso y</text>
  <text x="44" y="476" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="28" fill="#ffe9c2">ve tu descuento antes de pagar</text>
  <rect x="44" y="506" rx="31" width="320" height="62" fill="#ffffff"/>
  <text x="204" y="547" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="25" fill="#5e3a00">USAR CÓDIGO  →</text>
</svg>
