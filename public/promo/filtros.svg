<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140a1f"/>
      <stop offset="0.55" stop-color="#3b1259"/>
      <stop offset="1" stop-color="#a21caf"/>
    </linearGradient>
    <linearGradient id="gm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#c2410c"/></linearGradient>
    <linearGradient id="he" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a6b"/><stop offset="1" stop-color="#9f1239"/></linearGradient>
    <linearGradient id="di" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d1b6ff"/><stop offset="1" stop-color="#5b21b6"/></linearGradient>
    <linearGradient id="pl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe6ff"/><stop offset="1" stop-color="#3b5bb5"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="920" cy="300" r="240" fill="#e879f9" opacity=".3" filter="url(#glow)"/>

  <!-- panel de filtros -->
  <g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <rect x="700" y="110" rx="26" width="420" height="410" fill="#1a1024" stroke="#ffffff" stroke-opacity=".15" stroke-width="2"/>
    <text x="910" y="160" text-anchor="middle" font-size="26" fill="#fff">Rango</text>
    <g transform="translate(740 190)">
      <path d="M0 22l12 3-4-10 12 6 8-12 8 12 12-6-4 10 12-3-8 18c-4 12-12 20-20 24-8-4-16-12-20-24Z" fill="url(#gm)"/>
      <text x="80" y="38" font-size="26" fill="#fff">Gran Maestro</text>
      <rect x="300" y="12" rx="6" width="34" height="34" fill="#c8f04f"/><path d="M308 29l8 8 12-14" stroke="#10140a" stroke-width="5" fill="none"/>
    </g>
    <g transform="translate(740 270)">
      <path d="M2 10l10 3-4-8 10 6 8-9 8 9 10-6-4 8 10-3-6 16c-3 12-10 20-18 24-8-4-15-12-18-24Z" fill="url(#he)"/>
      <text x="80" y="38" font-size="26" fill="#fff">Heroico</text>
      <rect x="300" y="12" rx="6" width="34" height="34" fill="#c8f04f"/><path d="M308 29l8 8 12-14" stroke="#10140a" stroke-width="5" fill="none"/>
    </g>
    <g transform="translate(740 350)">
      <path d="M4 10l8 6 12-12 12 12 8-6v20c0 12-10 22-20 26-10-4-20-14-20-26Z" fill="url(#di)"/>
      <text x="80" y="38" font-size="26" fill="#fff">Diamante</text>
      <rect x="300" y="12" rx="6" width="34" height="34" fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="3"/>
    </g>
    <g transform="translate(740 430)">
      <path d="M24 2l22 9v17c0 14-10 24-22 28C12 52 2 42 2 28V11Z" fill="url(#pl)"/>
      <text x="80" y="38" font-size="26" fill="#fff">Platino</text>
      <rect x="300" y="12" rx="6" width="34" height="34" fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="3"/>
    </g>
  </g>

  <text x="66" y="190" font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900" font-style="italic" font-size="84" fill="#fff">ENCUENTRA</text>
  <text x="66" y="290" font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900" font-style="italic" font-size="84" fill="#fff">TU CUENTA</text>
  <text x="66" y="390" font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900" font-style="italic" font-size="84" fill="#f0abfc" stroke="#140a1f" stroke-width="5" paint-order="stroke">IDEAL</text>
  <text x="70" y="450" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="28" fill="#f5d0fe">Filtra por rango, nivel, servidor y precio</text>
  <rect x="70" y="490" rx="30" width="300" height="62" fill="#ffffff"/>
  <text x="220" y="531" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="26" fill="#3b1259">FILTRAR  →</text>
</svg>
