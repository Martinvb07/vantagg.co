<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" width="1600" height="480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1200"/>
      <stop offset="0.55" stop-color="#5e3a00"/>
      <stop offset="1" stop-color="#f29a00"/>
    </linearGradient>
    <linearGradient id="ticket" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#ffb100"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/>
  <circle cx="1290" cy="240" r="230" fill="#ffcc33" opacity=".3" filter="url(#glow)"/>
  <g fill="#fff" opacity=".9">
    <path d="M980 70 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 Z"/>
    <path d="M1540 90 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 Z"/>
    <path d="M1520 400 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z"/>
  </g>

  <!-- tiquete -->
  <g filter="url(#shadow)" transform="rotate(-8 1290 240)">
    <path d="M1070 140 h440 v60 a40 40 0 0 0 0 80 v60 h-440 v-60 a40 40 0 0 0 0 -80 Z" fill="url(#ticket)"/>
    <path d="M1210 150 v180" stroke="#5e3a00" stroke-width="4" stroke-dasharray="10 12"/>
    <text x="1140" y="263" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="60" fill="#5e3a00">%</text>
    <text x="1360" y="255" text-anchor="middle" font-family="Courier New, monospace" font-weight="700" font-size="52" letter-spacing="4" fill="#3a2400">CÓDIGO</text>
    <text x="1360" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="21" fill="#5e3a00">APLÍCALO AL PAGAR</text>
  </g>

  <text x="76" y="140" font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900" font-style="italic" font-size="76" fill="#fff">¿TIENES UN</text>
  <text x="70" y="262" font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900" font-style="italic" font-size="128" fill="url(#ticket)" stroke="#2a1800" stroke-width="5" paint-order="stroke">CÓDIGO?</text>
  <text x="82" y="318" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="30" fill="#ffe9c2">Escríbelo en el último paso y ve tu descuento antes de pagar</text>
  <rect x="80" y="350" rx="30" width="320" height="60" fill="#ffffff"/>
  <text x="240" y="390" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="25" fill="#5e3a00">USAR CÓDIGO  →</text>
</svg>
