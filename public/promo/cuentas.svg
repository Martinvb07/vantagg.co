<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c0505"/>
      <stop offset="0.5" stop-color="#5c0f12"/>
      <stop offset="1" stop-color="#d9480f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#e08a12"/></linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4be59d"/><stop offset="1" stop-color="#0f8a55"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a7a"/><stop offset="1" stop-color="#a3123b"/></linearGradient>
    <linearGradient id="dia" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7c2ff"/><stop offset="1" stop-color="#5b21b6"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="970" cy="320" r="250" fill="#ff9a3d" opacity=".35" filter="url(#glow)"/>
  <g opacity=".12" stroke="#fff" stroke-width="2"><path d="M560 0 L1200 630"/><path d="M680 0 L1200 520"/><path d="M440 0 L1080 630"/></g>

  <!-- escudo verificado -->
  <g filter="url(#shadow)" transform="translate(70 0)">
    <path d="M900 90 L1060 150 V290 C1060 400 990 470 900 510 C810 470 740 400 740 290 V150 Z" fill="url(#shield)" stroke="#d6ffe9" stroke-width="6"/>
    <path d="M835 300 L885 350 L975 250" fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- emblemas de rango (originales) -->
  <g filter="url(#shadow)" transform="translate(45 0)">
    <path d="M690 380 l45 -25 l45 25 v50 l-45 25 l-45 -25 Z" fill="url(#dia)" stroke="#efe4ff" stroke-width="4"/>
    <path d="M1010 410 l22 6 -8 -20 24 12 16 -22 16 22 24 -12 -8 20 22 -6 -14 30 c-8 24 -24 38 -40 46 c-16 -8 -32 -22 -40 -46 Z" fill="url(#hero)" stroke="#ffd0c8" stroke-width="4"/>
    <path d="M1080 120 l14 -6 8 -18 8 18 14 6 -10 14 2 20 -14 -6 -14 6 2 -20 Z" fill="url(#gold)"/>
  </g>

  <rect x="70" y="80" rx="18" width="220" height="44" fill="#ffffff" fill-opacity=".16"/>
  <text x="180" y="111" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="22" letter-spacing="5" fill="#fff">FREE FIRE</text>
  <text x="66" y="250" font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900" font-style="italic" font-size="112" fill="#fff">CUENTAS</text>
  <text x="66" y="360" font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900" font-style="italic" font-size="80" fill="url(#gold)" stroke="#3a0a08" stroke-width="5" paint-order="stroke">VERIFICADAS</text>
  <text x="70" y="420" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="30" fill="#ffd9c7">Nivel · Rango · Skins · Inventario a la vista</text>
  <rect x="70" y="470" rx="30" width="300" height="62" fill="#ffffff"/>
  <text x="220" y="511" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="26" fill="#5c0f12">VER CUENTAS  →</text>
</svg>
