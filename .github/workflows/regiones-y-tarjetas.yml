name: Regiones y tarjetas de Global

# Manual. 1) Apaga regiones en la tienda (por defecto Indonesia); «Activar todo» ya no las vuelve a mostrar.
# 2) Pasa las tarjetas de membresía (Semanal Básica, Semanal, Mensual) de Latinoamérica al producto de Global si
#    allá es más barato, solo si Central One confirma con cuentas reales de Latinoamérica que la de Global les llega
#    (comprobación gratuita, no compra nada). El precio baja, nunca por debajo de la ganancia mínima.
# Modo «revisar»: no cambia nada, solo informa. Modo «aplicar»: respalda la base de datos y aplica.
# El repositorio es público: se muestran precios de venta (son públicos), nunca costos, saldo ni IDs de jugadores.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: revisar (no cambia nada) o aplicar
        type: choice
        options: [revisar, aplicar]
        default: revisar
      apagar_regiones:
        description: "Regiones a apagar, separadas por coma (id = Indonesia). Vacío = ninguna"
        type: string
        default: id
      tarjetas_global:
        description: Pasar las tarjetas de Global a Latinoamérica
        type: choice
        options: ["si", "no"]
        default: si
      copiar_tarjetas_a:
        description: "Copiar las tarjetas de Latinoamérica (producto de Global y mismo precio) a estas regiones, ej. brazil. Vacío = ninguna"
        type: string
        default: ""
      borrar_paquetes:
        description: Borrar del todo los paquetes de las regiones quitadas y las tarjetas viejas ya reemplazadas (los pedidos se conservan)
        type: choice
        options: ["no", "si"]
        default: "no"

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  aplicar:
    name: Regiones y tarjetas
    runs-on: ubuntu-latest
    environment:
      name: produccion
    steps:
      - name: Preparar clave SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          for intento in 1 2 3 4 5; do
            ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && exit 0
            sleep 5
          done
          echo "ssh-keyscan falló tras 5 intentos"; exit 1

      - name: Revisar o aplicar
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          MODO: ${{ inputs.modo }}
          APAGAR: ${{ inputs.apagar_regiones }}
          TARJETAS: ${{ inputs.tarjetas_global }}
          BORRAR: ${{ inputs.borrar_paquetes }}
          COPIAR: ${{ inputs.copiar_tarjetas_a }}
        run: |
          set -euo pipefail
          [[ "$APAGAR" =~ ^[a-z0-9,\ -]{0,120}$ && "$COPIAR" =~ ^[a-z0-9,\ -]{0,120}$ ]] || { echo "✖ Regiones inválidas (usa slugs como id, eu, brazil)."; exit 1; }
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            "VPS_PATH='$VPS_PATH' MODO='$MODO' APAGAR='$APAGAR' TARJETAS='$TARJETAS' BORRAR='$BORRAR' COPIAR='$COPIAR' bash -s" <<'ENDSSH'
          set -euo pipefail
          export NVM_DIR="$HOME/.nvm"; [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          cd "$VPS_PATH"
          echo "== versión: commit $(git rev-parse --short HEAD) · modo: $MODO"

          if [ "$MODO" = "revisar" ] && [ "$TARJETAS" = "si" ]; then
            # Diagnóstico de solo lectura: cómo responde Central One al verificar cuentas de Latinoamérica con las
            # tarjetas de Global y de Latinoamérica (estado y motivo; sin IDs, precios ni costos).
            cat > /tmp/diag-tarjetas.cjs <<'JS'
          const { PrismaClient } = require("@prisma/client");
          const db = new PrismaClient();
          const base = (process.env.TOPUP_API_BASE_URL || "https://portal.centraloneglobal.com/api/v1").replace(/\/+$/, "");
          const H = { Authorization: `Bearer ${process.env.TOPUP_API_KEY || ""}`, Accept: "application/json" };
          const call = async (path, init = {}) => {
            try {
              const r = await fetch(base + path, { ...init, headers: { ...H, ...(init.body ? { "Content-Type": "application/json" } : {}) }, signal: AbortSignal.timeout(20000) });
              let j = null; try { j = await r.json(); } catch {}
              return { s: r.status, j };
            } catch (e) { return { s: 0, j: null }; }
          };
          const plain = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
          const kindOf = (n) => (/semanal\s+b.{0,3}sica/.test(plain(n)) ? "Semanal Básica" : /semanal/.test(plain(n)) ? "Semanal" : /mensual/.test(plain(n)) ? "Mensual" : null);
          const reg = (raw) => { const s = plain(raw || "global"); return /latam|latin/.test(s) ? "latam" : /global|worldwide/.test(s) ? "global" : s; };
          const schemaOf = (it) => (it.target_schema?.length ? it.target_schema : (it.target_fields || []).map((key) => ({ key, type: "text" })));
          (async () => {
            const c = await call("/catalog");
            const live = new Map((c.j?.items || []).map((i) => [i.product_id, i]));
            // Las tarjetas se toman de la copia del catálogo que usa la tienda (misma región y nombre que ve la tienda).
            const rows = await db.supplierProduct.findMany({ where: { regionSlug: { in: ["latam", "global"] } }, select: { productKey: true, regionSlug: true, name: true } });
            const items = rows.filter((r) => kindOf(r.name) && live.has(r.productKey)).map((r) => ({ ...live.get(r.productKey), region: r.regionSlug }));
            console.log(`   catálogo en vivo: ${live.size} productos · tarjetas de Latinoamérica y Global en la copia de la tienda: ${rows.filter((r) => kindOf(r.name)).length} (${items.length} también en vivo)`);
            const orders = await db.order.findMany({ where: { type: "TOPUP", status: "DELIVERED", isTest: false, playerId: { not: null } }, orderBy: { deliveredAt: "desc" }, take: 60, select: { playerId: true, itemSnapshot: true } });
            const ids = [...new Set(orders.filter((o) => (o.itemSnapshot || {}).region === "latam").map((o) => o.playerId))].slice(0, 2);
            console.log(`== Diagnóstico Central One (catálogo HTTP ${c.s}) · ${ids.length} cuenta(s) de Latinoamérica`);
            for (const it of items.sort((a, b) => String(a.name).localeCompare(String(b.name)))) {
              const schema = schemaOf(it);
              const fields = schema.map((f) => (f.type === "select" ? `${f.key}[${(f.options || []).map((o) => o.label || o.value).join("/")}]` : f.key)).join(", ");
              const extra = Object.keys(it).filter((k) => /region|market|countr|server|note|descr|warn|compat/i.test(k)).map((k) => `${k}=${JSON.stringify(it[k]).slice(0, 80)}`).join(" · ");
              console.log(`-- ${reg(it.region || it.market)} · ${kindOf(it.name)} · «${it.name}» · ${it.in_stock === false ? "agotado" : "con existencias"} · pide: ${fields || "(nada)"}${extra ? " · " + extra : ""}`);
              for (const [i, id] of ids.entries()) {
                const target_payload = Object.fromEntries(schema.map((f) => [f.key, f.type === "select" ? (f.options || [])[0]?.value : id]));
                const v = await call("/player/validate", { method: "POST", body: JSON.stringify({ product_id: it.product_id, target_payload }) });
                const why = v.s === 200 ? [v.j?.status, v.j?.reason, v.j?.code].filter(Boolean).join(" / ") : `HTTP ${v.s} ${v.j?.error?.code ?? ""}`;
                console.log(`     cuenta ${i + 1}: ${why || "(sin estado)"}`);
                await new Promise((r) => setTimeout(r, 2500)); // límite de Central One: 30 por minuto
              }
            }
            await db.$disconnect();
          })();
          JS
            NODE_PATH="$PWD/node_modules" node --env-file=.env /tmp/diag-tarjetas.cjs | sed -E 's/[0-9]{6,12}/<id>/g' || true
            rm -f /tmp/diag-tarjetas.cjs
          fi

          if [ "$MODO" = "aplicar" ]; then
            # Respaldo de la base de datos antes de cambiar regiones y paquetes (si falla, no se cambia nada).
            dest="${RESPALDOS_DIR:-$HOME/respaldos-tienda}"; mkdir -p "$dest"
            archivo="$dest/db-antes-regiones-tarjetas-$(date +%Y%m%d-%H%M).sql.gz"
            mysqldump --defaults-extra-file="$HOME/.my-vanta.cnf" --single-transaction --routines --no-tablespaces vanta_store | gzip > "$archivo"
            [ "$(gzip -cd "$archivo" | head -c 100000 | grep -c 'CREATE TABLE')" -gt 0 ] || { echo "✖ El respaldo salió vacío: no se cambió nada."; exit 1; }
            echo "✔ respaldo: $(basename "$archivo") ($(du -h "$archivo" | cut -f1))"
          fi

          s=$(grep -E '^CRON_SECRET=' .env | tail -n1 | cut -d= -f2- | tr -d '"')
          [ -n "$s" ] || { echo "✖ Falta CRON_SECRET en .env"; exit 1; }
          body=$(node -e 'const off = (process.env.APAGAR || "").split(",").map((x) => x.trim()).filter(Boolean); console.log(JSON.stringify({ off, cards: process.env.TARJETAS === "si", purge: process.env.BORRAR === "si", copyTo: (process.env.COPIAR || "").split(",").map((x) => x.trim()).filter(Boolean), dryRun: process.env.MODO !== "aplicar" }))')
          r=$(curl -sS --max-time 300 -X POST -H "Authorization: Bearer $s" -H "Content-Type: application/json" -H "Host: vantagg.co" -H "X-Forwarded-Proto: https" \
            --data "$body" http://127.0.0.1:3020/api/cron/regiones-tarjetas || true)
          printf '%s' "$r" | node -e '
            let t = ""; process.stdin.on("data", (c) => (t += c)).on("end", () => {
              let j; try { j = JSON.parse(t); } catch { console.log("✖ Respuesta inesperada:", t.slice(0, 300)); process.exit(1); }
              if (!j.ok) { console.log("✖ No se pudo:", j.error || t.slice(0, 300)); process.exit(1); }
              const cop = (n) => (n == null ? "—" : "$" + Number(n).toLocaleString("es-CO"));
              const R = j.regions;
              console.log("");
              console.log(`== Regiones visibles: ${R.before.join(", ")}${j.dryRun ? "  →  quedarían: " : "  →  ahora: "}${R.after.join(", ")}`);
              if (!j.dryRun) console.log(`   Quitadas de la tienda («Activar todo» no las vuelve a traer): ${R.off.join(", ") || "ninguna"} · ${R.deactivated} paquete(s) desactivados`);
              console.log("");
              console.log(`== Historial: ${j.evidence.globalDelivered} recarga(s) de Global entregadas · ${j.evidence.latamAccounts} de ellas a cuentas que también recibieron recargas de Latinoamérica`);
              if (j.cards) {
                console.log("");
                console.log(`== Tarjetas de Global en Latinoamérica (${j.cards.accounts} cuenta(s) real(es) de Latinoamérica para comprobar):`);
                const icon = { moved: "✔", created: "✔", kept: "•", skipped: "⚠" };
                for (const m of j.cards.moves) {
                  const c = m.checks, tot = c.valid + c.invalid + c.unverified;
                  const price = m.priceFrom != null && m.priceTo != null && m.priceFrom !== m.priceTo ? ` · ${cop(m.priceFrom)} → ${cop(m.priceTo)}` : m.priceTo != null ? ` · ${cop(m.priceTo)}` : "";
                  const chk = tot ? ` · Central One: ${c.valid} cuenta(s) aceptada(s), ${c.invalid} rechazada(s), ${c.unverified} sin respuesta` : "";
                  console.log(`   ${icon[m.action] || "•"} ${m.card}: ${m.reason}${price}${chk}`);
                }
              }
              if (j.purged) {
                const P = j.purged, regs = Object.entries(P.regions);
                console.log("");
                console.log(`== ${j.dryRun ? "Se borrarían" : "Borrados"} de la base: ${regs.length ? regs.map(([r, n]) => `${n} paquete(s) de ${r}`).join(", ") : "ningún paquete de regiones quitadas"}${P.cards.length ? ` · tarjetas viejas: ${P.cards.join(", ")}` : ""}`);
                if (P.orders) console.log(`   ${P.orders} pedido(s) los usaban: se conservan con su copia del producto (solo pierden el vínculo).`);
              }
              for (const [region, list] of Object.entries(j.copies || {})) {
                console.log("");
                console.log(`== Tarjetas de Latinoamérica copiadas a ${region}:`);
                const icon = { updated: "✔", created: "✔", kept: "•", skipped: "⚠" };
                for (const c of list) {
                  const price = c.priceFrom != null && c.priceTo != null && c.priceFrom !== c.priceTo ? ` · ${cop(c.priceFrom)} → ${cop(c.priceTo)}` : c.priceTo != null ? ` · ${cop(c.priceTo)}` : "";
                  console.log(`   ${icon[c.action] || "•"} ${c.card}: ${c.reason}${price}`);
                }
              }
              if (j.dryRun) { console.log(""); console.log("ℹ Modo revisar: no se cambió nada. Corre de nuevo con modo «aplicar» para hacerlo."); }
            });'
          ENDSSH

      - name: Limpiar credenciales
        if: always()
        run: rm -f ~/.ssh/deploy_key
