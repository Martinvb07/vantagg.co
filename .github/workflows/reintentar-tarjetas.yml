name: Reintentar entregas de tarjetas

# Manual. Tarjetas y pases pagados que no llegaron: los que usaron el producto de Global pasan al de su región,
# se consulta a Central One el estado real y se reintenta la entrega (nunca compra dos veces: antes confirma que
# la orden anterior falló). «revisar» no cambia nada. Repositorio público: sin costos, saldo ni datos de clientes.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: revisar (no cambia nada) o reintentar
        type: choice
        options: [reintentar, revisar]
        default: reintentar

jobs:
  reintentar:
    name: Reintentar entregas
    runs-on: ubuntu-latest
    environment:
      name: produccion
    steps:
      - name: Preparar clave SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          for intento in 1 2 3 4 5; do
            ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && exit 0
            sleep 5
          done
          echo "ssh-keyscan falló tras 5 intentos"; exit 1

      - name: Reintentar
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          MODO: ${{ inputs.modo }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            "VPS_PATH='$VPS_PATH' MODO='$MODO' bash -s" <<'ENDSSH'
          set -euo pipefail
          export NVM_DIR="$HOME/.nvm"; [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          cd "$VPS_PATH"
          echo "== versión: commit $(git rev-parse --short HEAD) · modo: $MODO"
          s=$(grep -E '^CRON_SECRET=' .env | tail -n1 | cut -d= -f2- | tr -d '"')
          [ -n "$s" ] || { echo "✖ Falta CRON_SECRET en .env"; exit 1; }
          body=$([ "$MODO" = "revisar" ] && echo '{"dryRun": true}' || echo '{"dryRun": false}')
          r=$(curl -sS --max-time 280 -X POST -H "Authorization: Bearer $s" -H "Content-Type: application/json" -H "Host: vantagg.co" -H "X-Forwarded-Proto: https" \
            --data "$body" http://127.0.0.1:3020/api/cron/reintentar-tarjetas || true)
          printf '%s' "$r" | node -e '
            let t = ""; process.stdin.on("data", (c) => (t += c)).on("end", () => {
              let j; try { j = JSON.parse(t); } catch { console.log("✖ Respuesta inesperada:", t.slice(0, 300)); process.exit(1); }
              if (!j.ok) { console.log("✖ No se pudo:", j.error || t.slice(0, 300)); process.exit(1); }
              const L = { PAID: "Pagado", PROCESSING: "En procesamiento", DELIVERED: "Entregado", DELIVERY_FAILED: "Entrega fallida", REFUND_REQUESTED: "Reembolso solicitado", REFUNDED: "Reembolsado", CANCELLED: "Cancelado" };
              console.log(`== Tarjetas y pases pagados sin entregar: ${j.found}`);
              for (const x of j.results) console.log(`   ${x.after === "DELIVERED" ? "✔" : x.after === "DELIVERY_FAILED" ? "✖" : "•"} ${x.number} · ${x.item}: ${L[x.before] || x.before} → ${L[x.after] || x.after}${x.message ? " · " + x.message : ""}`);
              if (j.dryRun) console.log("ℹ Modo revisar: no se cambió nada.");
            });'
          ENDSSH

      - name: Limpiar credenciales
        if: always()
        run: rm -f ~/.ssh/deploy_key
