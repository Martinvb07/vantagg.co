name: Revisión de pedidos y cobros

# Manual y de SOLO LECTURA. Revisa los pedidos recientes, sus cobros y lo que Bold dice de cada link de pago (consulta
# de estado, sin cobrar nada), si llegan los avisos de pago (webhooks) y los errores recientes de la tienda.
# Repositorio público: NO muestra montos, correos, IDs de jugador ni referencias completas; de cada pedido solo los
# últimos 5 caracteres del número (para buscarlo en el panel), horas, estados y si el monto de Bold coincide (✔/✖).
on:
  workflow_dispatch:
    inputs:
      horas:
        description: Horas hacia atrás a revisar
        type: string
        default: "72"

jobs:
  revisar:
    name: Pedidos y cobros
    runs-on: ubuntu-latest
    environment:
      name: produccion
    steps:
      - name: Preparar clave SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          for intento in 1 2 3 4 5 6 7 8; do
            ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && exit 0
            sleep 6
          done
          echo "ssh-keyscan falló tras 8 intentos"; exit 1

      - name: Revisar
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          HORAS: ${{ inputs.horas }}
        run: |
          set -euo pipefail
          [[ "$HORAS" =~ ^[0-9]{1,3}$ ]] || { echo "✖ Horas inválidas."; exit 1; }
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            "VPS_PATH='$VPS_PATH' HORAS='$HORAS' bash -s" <<'ENDSSH' | sed -E \
              -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<correo>/g' \
              -e 's/Bearer [A-Za-z0-9._~+\/=-]+/Bearer <oculto>/g'
          set -uo pipefail
          export NVM_DIR="$HOME/.nvm"; [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          cd "$VPS_PATH"
          echo "== versión: commit $(git rev-parse --short HEAD) · hora del servidor: $(date -u '+%Y-%m-%d %H:%M UTC') ($(TZ=America/Bogota date '+%d %b %H:%M') en Colombia)"
          for ruta in / /recargas /api/health; do
            echo "   $ruta → HTTP $(curl -s -o /dev/null -w '%{http_code} en %{time_total}s' --max-time 20 -H 'Host: vantagg.co' -H 'X-Forwarded-Proto: https' http://127.0.0.1:3020$ruta)"
          done

          # Avisos de pago (webhooks): ¿llegan al servidor? (registro de nginx: solo fecha, ruta y código de respuesta)
          echo "== Avisos de pago que llegaron al servidor (nginx), por día y respuesta:"
          if ls /var/log/nginx/access.log* >/dev/null 2>&1 && [ -r /var/log/nginx/access.log ]; then
            { cat /var/log/nginx/access.log /var/log/nginx/access.log.1 2>/dev/null; zcat /var/log/nginx/access.log.*.gz 2>/dev/null; } \
              | grep "/api/webhooks/" | awk '{d=substr($4,2,11); print d, $7, $9}' | sed -E 's/\?[^ ]*//' | sort | uniq -c | tail -n 30 | sed 's/^/   /'
            echo "   (si no aparece ninguna línea de /api/webhooks/bold, Bold no está enviando los avisos)"
          else
            echo "   (sin permiso para leer el registro de nginx)"
          fi
          errlog=$(pm2 jlist 2>/dev/null | node -e 'let t="";process.stdin.on("data",c=>t+=c).on("end",()=>{try{const p=JSON.parse(t).find(x=>x.name==="vanta");console.log(p?.pm2_env?.pm_err_log_path||"")}catch{console.log("")}})' || true)
          outlog=$(pm2 jlist 2>/dev/null | node -e 'let t="";process.stdin.on("data",c=>t+=c).on("end",()=>{try{const p=JSON.parse(t).find(x=>x.name==="vanta");console.log(p?.pm2_env?.pm_out_log_path||"")}catch{console.log("")}})' || true)
          echo "== Mensajes de la tienda sobre avisos de pago (últimos):"
          cat "$errlog" "$outlog" 2>/dev/null | grep -a "\[webhook:" | sed -E 's/\(([A-Z]{2,4}-)?[A-Z0-9-]{4,}\)/(…)/g; s/[0-9]{6,}/…/g' | cut -c1-200 | tail -n 8 | sed 's/^/   /' || true
          echo "== Errores recientes de la tienda (sin datos de clientes):"
          [ -n "$errlog" ] && [ -f "$errlog" ] && tail -n 300 "$errlog" | grep -aE "Error|error|✖|falló|fallaron" | sed -E 's/[0-9]{6,}/…/g' | cut -c1-200 | tail -n 12 | sed 's/^/   /'
          [ -f logs/mantenimiento-ultimo.json ] && echo "== Mantenimiento automático: última corrida hace $(( ($(date +%s) - $(stat -c %Y logs/mantenimiento-ultimo.json)) / 60 )) min"
          # Panel: cómo respondió el servidor hoy a las páginas del panel (solo secciones conocidas; nunca la dirección secreta).
          echo "== Panel: respuestas de hoy (nginx, hora del servidor), por página y código:"
          if [ -r /var/log/nginx/access.log ]; then
            grep -h "$(date +%d/%b/%Y)" /var/log/nginx/access.log | awk '{split($7,a,"?"); p=a[1]; rsc=(a[2] ~ /_rsc=/) ? " (navegación)" : ""; if (p ~ /^\/(admin(\/(pedidos|clientes|cuentas|chats|ajustes|paquetes|integraciones|proveedor|soporte|reclamos|usuarios|codigos|banners|correos|seguridad|auditoria)(\/[A-Za-z0-9_-]+)?)?|api\/admin\/pulse)$/) { gsub(/\/[a-z0-9]{20,}$/, "/:id", p); print p rsc, $9 } }' \
              | sort | uniq -c | sort -rn | head -n 15 | sed 's/^/   /'
          fi
          [ -r /var/log/nginx/error.log ] && echo "   avisos de nginx hoy (tiempo agotado / sin respuesta de la tienda): $(grep -c "$(date +%Y/%m/%d).*\(timed out\|upstream prematurely\|connect() failed\)" /var/log/nginx/error.log)"

          cat > /tmp/revision-pedidos.cjs <<'JS'
          const { PrismaClient } = require("@prisma/client");
          const db = new PrismaClient();
          const H = 3600_000, HORAS = Math.min(Number(process.env.HORAS) || 72, 720);
          const fmt = (d) => (d ? new Intl.DateTimeFormat("es-CO", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZone: "America/Bogota" }).format(new Date(d)) : "—");
          const ymd = (d) => new Intl.DateTimeFormat("en-CA", { timeZone: "America/Bogota" }).format(new Date(d));
          const short = (n) => "…" + String(n).slice(-5);
          async function boldLink(id) {
            const key = process.env.BOLD_API_KEY;
            if (!key) return { error: "sin llave de Bold" };
            try {
              const r = await fetch(`https://integrations.api.bold.co/online/link/v1/${encodeURIComponent(id)}`, { headers: { Authorization: `x-api-key ${key}` }, signal: AbortSignal.timeout(10_000) });
              if (!r.ok) return { error: `Bold HTTP ${r.status}` };
              const l = await r.json();
              return { status: l.status, total: Math.round(Number(l.total) || 0), method: l.payment_method, tx: !!l.transaction_id };
            } catch (e) { return { error: String(e.message).slice(0, 60) }; }
          }
          (async () => {
            const now = Date.now(), since = new Date(now - HORAS * H), today = ymd(now);
            // Lo que consulta la página Pedidos del panel al abrirse (para ver si tarda).
            const t0 = Date.now();
            await Promise.all([
              db.order.findMany({ orderBy: { createdAt: "desc" }, take: 30, include: { delivery: { select: { simulated: true } } } }),
              db.order.count(),
              db.order.aggregate({ where: { status: { in: ["PAID", "PROCESSING", "DELIVERED"] } }, _sum: { total: true } }),
            ]);
            const t1 = Date.now();
            await db.order.findMany({ where: { status: "CANCELLED", isTest: false, cancelledAt: { gte: new Date(now - 30 * 24 * H) } }, include: { notifications: true, events: true, payments: true }, take: 2000 });
            console.log(`== Página Pedidos del panel: listado ${t1 - t0} ms · recordatorios ${Date.now() - t1} ms · pedidos en total: ${await db.order.count()}`);
            const hooks = await db.webhookEvent.groupBy({ by: ["provider"], where: { createdAt: { gte: new Date(now - 10 * 24 * H) } }, _count: true });
            console.log(`== Avisos de pago registrados por la tienda en 10 días: ${hooks.length ? hooks.map((h) => `${h.provider}: ${h._count}`).join(" · ") : "NINGUNO ✖"}`);
            const orders = await db.order.findMany({
              where: { isTest: false, OR: [{ createdAt: { gte: since } }, { paidAt: { gte: since } }, { updatedAt: { gte: new Date(now - 36 * H) } }] },
              orderBy: { createdAt: "desc" }, take: 300,
              include: { payments: true, delivery: { select: { status: true, attempts: true } }, events: { where: { type: { in: ["CHECKOUT_STARTED", "PAYMENT_CONFIRMED"] } }, orderBy: { createdAt: "asc" }, select: { type: true, actor: true, data: true, createdAt: true } } },
            });
            const alerts = [];
            const lines = [];
            let calls = 0;
            for (const o of orders) {
              const links = [];
              for (const e of o.events) {
                const d = e.data || {};
                if (e.type === "CHECKOUT_STARTED" && d.provider === "bold" && d.checkoutRef && calls < 150) { calls++; links.push(await boldLink(d.checkoutRef)); }
              }
              const paidLinks = links.filter((l) => l.status === "PAID");
              const approved = o.payments.filter((p) => p.status === "APPROVED");
              const expected = o.chargeCurrency && o.chargeCurrency !== o.currency ? o.chargeAmount : o.total;
              const amountOk = paidLinks.length ? paidLinks.every((l) => l.total === expected) : approved.every((p) => p.amount === expected);
              const how = o.events.find((e) => e.type === "PAYMENT_CONFIRMED")?.actor || "";
              const via = how.startsWith("WEBHOOK") ? "aviso de Bold" : how.startsWith("POLL") ? "consulta automática" : how.startsWith("RECONCILE") ? "conciliación" : how.startsWith("RETURN") ? "regreso del cliente" : how ? how.split(":")[0].toLowerCase() : "";
              const linkTxt = links.length ? links.map((l) => l.error ? `error (${l.error})` : `${l.status}${l.method ? " " + l.method : ""}`).join(", ") : "sin link";
              const flags = [];
              if (["PAID", "PROCESSING", "DELIVERED", "DELIVERY_FAILED"].includes(o.status)) {
                if (!approved.length) flags.push("✖ SIN COBRO APROBADO registrado");
                const answered = links.filter((l) => !l.error);
                if (answered.length && !paidLinks.length) flags.push("✖ Bold NO reporta este link pagado");
                if (links.length && !answered.length) flags.push("⚠ no se pudo consultar a Bold");
                if (!amountOk) flags.push("✖ MONTO DE BOLD DISTINTO al del pedido");
              }
              if ((o.status === "CANCELLED" || o.status === "PENDING_PAYMENT") && paidLinks.length) flags.push("✖ BOLD DICE PAGADO pero el pedido NO está pagado");
              if (o.status === "DELIVERY_FAILED") flags.push("⚠ entrega fallida");
              if (flags.some((f) => f.startsWith("✖"))) alerts.push(short(o.number));
              lines.push({ day: ymd(o.createdAt), txt: `${short(o.number)} · creado ${fmt(o.createdAt)} · ${o.type === "TOPUP" ? "recarga" : "cuenta"} · ${o.status}${o.paidAt ? ` · pagado ${fmt(o.paidAt)}${via ? ` (${via})` : ""}` : ""}${o.deliveredAt ? ` · entregado ${fmt(o.deliveredAt)}` : ""} · cobro en tienda: ${o.payments.map((p) => `${p.status}${p.method ? " " + p.method : ""}`).join(", ") || "ninguno"} · Bold: ${linkTxt}${paidLinks.length ? (amountOk ? " · monto igual ✔" : "") : ""}${flags.length ? " · " + flags.join(" · ") : ""}` });
            }
            const hoy = lines.filter((l) => l.day === today);
            console.log("");
            console.log(`== PEDIDOS DE HOY (${today}, hora Colombia): ${hoy.length}`);
            for (const l of hoy) console.log("   " + l.txt);
            console.log("");
            console.log(`== Pedidos anteriores (últimas ${HORAS} h o con cambios recientes): ${lines.length - hoy.length}`);
            for (const l of lines.filter((x) => x.day !== today)) console.log("   " + l.txt);
            console.log("");
            const days = await db.$queryRawUnsafe("SELECT DATE(DATE_SUB(createdAt, INTERVAL 5 HOUR)) d, status, COUNT(*) n FROM `Order` WHERE createdAt >= NOW() - INTERVAL 10 DAY AND isTest = 0 GROUP BY d, status ORDER BY d");
            const byDay = {};
            for (const r of days) { const k = new Date(r.d).toISOString().slice(0, 10); (byDay[k] ||= []).push(`${r.status} ${Number(r.n)}`); }
            console.log("== Pedidos por día (hora Colombia), últimos 10 días:");
            for (const [d, v] of Object.entries(byDay)) console.log(`   ${d}: ${v.join(" · ")}`);
            const s = Object.fromEntries((await db.setting.findMany({ where: { key: { in: ["maintenanceMode", "purgeCancelled"] } } })).map((r) => [r.key, r.value]));
            const pk = await db.diamondPackage.count({ where: { active: true, available: true } });
            console.log(`== Tienda: modo mantenimiento ${s.maintenanceMode === "true" ? "✖ ACTIVADO (no vende)" : "apagado"} · paquetes a la venta: ${pk} · links de Bold consultados: ${calls}`);
            console.log(alerts.length ? `✖ REVISAR ${alerts.length} pedido(s): ${alerts.join(", ")}` : "✔ Ningún pedido con cobro dudoso: todo lo pagado en Bold está en la tienda con el mismo monto y nada se entregó sin pago.");
            await db.$disconnect();
          })().catch(async (e) => { console.log("✖", e.message); await db.$disconnect(); process.exit(1); });
          JS
          HORAS="$HORAS" NODE_PATH="$PWD/node_modules" node --env-file=.env /tmp/revision-pedidos.cjs
          rm -f /tmp/revision-pedidos.cjs
          ENDSSH

      - name: Limpiar credenciales
        if: always()
        run: rm -f ~/.ssh/deploy_key
