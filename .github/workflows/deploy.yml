name: CI y Deploy a VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nunca dos deploys simultáneos sobre el mismo servidor.
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  ci:
    name: Revisar la tienda (tipos, pruebas y build)
    runs-on: ubuntu-latest
    services:
      # MySQL de prueba: las migraciones y el build se validan contra una base real y vacía
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: vanta_store
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:ci@127.0.0.1:3306/vanta_store
      AUTH_SECRET: ci-solo-para-compilar-0000000000000000000000
      APP_URL: https://vantagg.co
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22 + caché de npm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        run: npm ci

      - name: Migraciones (sobre base vacía)
        run: npx prisma migrate deploy

      - name: Tipos
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Build
        # next/font descarga las fuentes de Google al compilar y a veces Google responde mal: un reintento.
        run: npm run build || { echo "Reintentando el build en 20 s..."; sleep 20; npm run build; }

  desplegar:
    name: Desplegar en VPS
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: https://vantagg.co
    steps:
      - name: Preparar clave SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ssh-keyscan falla de forma intermitente desde los runners:
          # reintentar hasta 5 veces antes de rendirse.
          exito=""
          for intento in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              exito=1
              break
            fi
            echo "ssh-keyscan intento $intento fallido; reintentando en 5s..."
            sleep 5
          done
          if [ -z "$exito" ]; then
            echo "ssh-keyscan fallo tras 5 intentos"
            exit 1
          fi

      - name: Actualizar código, migrar, construir y recargar PM2
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 \
              "$VPS_USER@$VPS_HOST" \
              "VPS_PATH='$VPS_PATH' GIT_SHA='${{ github.sha }}' bash -s" <<'ENDSSH'
          set -euo pipefail
          # PM2 y Node instalados con nvm no están en el PATH de una sesión no interactiva.
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          cd "$VPS_PATH"

          # Versión actual, por si hay que revertir.
          ANTERIOR="$(git rev-parse HEAD)"

          # Las migraciones leen DATABASE_URL de .env (Prisma lo carga solo).
          # La tienda sigue atendiendo mientras se construye: las dependencias solo se reinstalan si cambió
          # package-lock.json y el build va a una carpeta aparte que reemplaza a .next justo antes de reiniciar.
          construir() {
            local huella
            huella="$(sha256sum package-lock.json | cut -d' ' -f1)"
            if [ "$(cat node_modules/.huella-lock 2>/dev/null)" != "$huella" ]; then
              npm ci
              echo "$huella" > node_modules/.huella-lock
            else
              echo "Dependencias sin cambios: se omite npm ci"
            fi
            npx prisma migrate deploy
            rm -rf .next-nuevo
            # next/font descarga las fuentes de Google al compilar y a veces Google responde mal: un reintento.
            NEXT_DIST_DIR=.next-nuevo npm run build || { echo "Reintentando el build en 20 s..."; sleep 20; NEXT_DIST_DIR=.next-nuevo npm run build; }
            rm -rf .next-viejo
            if [ -d .next ]; then mv .next .next-viejo; fi
            mv .next-nuevo .next
          }

          # Se recrea desde ecosystem.config.js para que siempre use su carpeta y variables.
          recargar_pm2() {
            mkdir -p logs
            pm2 delete vanta >/dev/null 2>&1 || true
            pm2 start deploy/ecosystem.config.js
            pm2 save
          }

          # Espera hasta ~75s a que la URL responda 200.
          verificar() {
            local url="$1" intentos=0 codigo
            while true; do
              codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$url" || echo 000)
              [ "$codigo" = "200" ] && return 0
              intentos=$((intentos + 1))
              [ "$intentos" -ge 25 ] && { echo "!! $url respondio $codigo"; return 1; }
              sleep 3
            done
          }

          git fetch --prune origin
          git reset --hard "$GIT_SHA"
          # -fd no toca archivos ignorados (.env, node_modules, .next, logs).
          git clean -fd

          construir
          recargar_pm2

          # Health check: /api/health responde 200 si la tienda y la base funcionan. Si falla,
          # se reconstruye la versión anterior y se recarga PM2 (las migraciones ya aplicadas no se deshacen).
          if ! verificar "http://127.0.0.1:3020/api/health"; then
            echo "!! Health check fallido — registros:"
            pm2 describe vanta | grep -E "status|script path|exec cwd|restarts" || true
            pm2 logs vanta --lines 60 --nostream || true
            echo "!! Quien usa el puerto 3020:"
            ss -ltnp "sport = :3020" || true
            echo "!! Revirtiendo a $ANTERIOR"
            git reset --hard "$ANTERIOR"
            git clean -fd
            construir
            recargar_pm2
            exit 1
          fi

          echo "OK — desplegado $(git rev-parse --short HEAD)"
          ENDSSH

      - name: Limpiar credenciales
        if: always()
        run: rm -f ~/.ssh/deploy_key
