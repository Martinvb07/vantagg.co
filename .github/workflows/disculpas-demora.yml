name: Disculpas por demora

# Manual. Correo de disculpa («hubo un retraso en nuestro sistema») a los clientes cuya recarga llegó más de 1 hora
# después de pagar y que aún no la recibieron (una sola vez por pedido). De aquí en adelante la disculpa va sola en el
# correo de entrega; esto es para pedidos ya entregados.
#   - revisar: solo muestra a quiénes les llegaría.
#   - enviar: envía los correos.
# Repositorio público: solo el final del número de pedido y las horas (nunca correos).
on:
  workflow_dispatch:
    inputs:
      modo:
        description: ¿Revisar o enviar?
        type: choice
        options: [revisar, enviar]
        default: revisar
      dias:
        description: Pedidos entregados en los últimos N días
        type: string
        default: "15"

jobs:
  disculpas:
    name: Disculpas por demora
    runs-on: ubuntu-latest
    environment:
      name: produccion
    steps:
      - name: Preparar clave SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          for intento in 1 2 3 4 5 6 7 8; do
            ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && exit 0
            sleep 6
          done
          echo "ssh-keyscan falló tras 8 intentos"; exit 1

      - name: Disculpas
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          MODO: ${{ inputs.modo }}
          DIAS: ${{ inputs.dias }}
        run: |
          set -euo pipefail
          [[ "$DIAS" =~ ^[0-9]{1,2}$ ]] || { echo "✖ Días inválidos."; exit 1; }
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            "VPS_PATH='$VPS_PATH' MODO='$MODO' DIAS='$DIAS' bash -s" <<'ENDSSH' | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<correo>/g'
          set -euo pipefail
          cd "$VPS_PATH"
          echo "== versión: commit $(git rev-parse --short HEAD) · modo: $MODO"
          s=$(grep -E '^CRON_SECRET=' .env | tail -n1 | cut -d= -f2- | tr -d "\"'")
          dry=$([ "$MODO" = "enviar" ] && echo false || echo true)
          r=$(printf 'header = "Authorization: Bearer %s"\n' "$s" | curl -sS -K - --max-time 120 -X POST -H "Content-Type: application/json" -H "Host: vantagg.co" -H "X-Forwarded-Proto: https" \
            --data "{\"dryRun\": $dry, \"days\": $DIAS}" -w '\nHTTP %{http_code}' http://127.0.0.1:3020/api/cron/disculpas || true)
          echo "$r" | tail -n1
          echo "$r" | head -n1 | node -e 'let t="";process.stdin.on("data",c=>t+=c).on("end",()=>{try{const j=JSON.parse(t);console.log(j.dryRun?`== Les llegaría la disculpa a ${j.count} cliente(s):`:`✔ Disculpa enviada a ${j.count} cliente(s):`);for(const o of j.orders)console.log(`   ${o.order} · pagó ${o.paid} · recibió ${o.delivered} · esperó ${Math.floor(o.waitedMin/60)} h ${o.waitedMin%60} min`);if(!j.count)console.log("   (ninguno pendiente)")}catch{console.log("✖ respuesta inesperada")}})'
          ENDSSH

      - name: Limpiar credenciales
        if: always()
        run: rm -f ~/.ssh/deploy_key
