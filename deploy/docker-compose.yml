# Servidor completo en un VPS: tienda + MySQL + HTTPS automático (Caddy).
# Uso (desde la carpeta deploy/):  docker compose --env-file .env.production up -d --build
# Ver DESPLIEGUE.md.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: vanta_store
      MYSQL_USER: vanta
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en deploy/.env.production}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en deploy/.env.production}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: mysql://vanta:${MYSQL_PASSWORD}@db:3306/vanta_store
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:?Define DOMINIO en deploy/.env.production (ej. tienda.com)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  mysql-data:
  uploads:
  caddy-data:
  caddy-config:
