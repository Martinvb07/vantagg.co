# nginx para la tienda VANTA (vantagg.co). Copiar a /etc/nginx/sites-available/vantagg
# Luego:  ln -s /etc/nginx/sites-available/vantagg /etc/nginx/sites-enabled/  &&  nginx -t  &&  systemctl reload nginx
# El certificado HTTPS lo pone certbot:  certbot --nginx -d vantagg.co -d www.vantagg.co
#
# La tienda corre con PM2 en 127.0.0.1:3020 (deploy/ecosystem.config.js).

upstream vanta_tienda {
    server 127.0.0.1:3020;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name vantagg.co www.vantagg.co;
    server_tokens off; # no anunciar la versión de nginx

    # certbot agrega aqui la redireccion a https; mientras tanto la tienda responde por http
    location / {
        proxy_pass http://vanta_tienda;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # $remote_addr (no $proxy_add_x_forwarded_for): nadie puede falsear su IP
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

